services:
  - type: web
    name: mobile-price-predictor
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --preload --max-requests 500 --worker-class sync app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: WEB_CONCURRENCY
        value: 2
    healthCheckPath: /health